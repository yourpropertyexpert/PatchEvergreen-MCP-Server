# Deploy with a Docker nginx proxy (network_mode: host, sites-enabled -> conf.d):
#
# 1. Copy pegmcp.conf into your nginx sites-enabled/ directory (mounted as /etc/nginx/conf.d).
# 2. Copy this file into sites-enabled (git pull does NOT update sites-enabled automatically):
#      cp pegmcp.conf /home/mark/git/nginx/sites-enabled/pegmcp.conf
# 3. Add this volume to your nginx docker-compose.yml:
#      - ../PatchEvergreen-MCP-Server/multisite:/var/www/patchevergreen-mcp:ro
# 4. Recreate nginx (required when adding/changing volumes):
#      cd /home/mark/git/nginx && docker compose up -d --force-recreate
# 5. Verify mount (must be a file, not a directory):
#      docker exec nginx-proxy ls -la /var/www/patchevergreen-mcp/404.html
# 6. Start backends: cd multisite && docker compose up -d
#
# HTTPS is terminated at Cloudflare; this vhost listens on HTTP only.
# Upstreams use 127.0.0.1 because the nginx container runs with network_mode: host and
# the MCP/Flask containers publish 8101/8102 on the host loopback interface.

upstream mcp_sse {
    server 127.0.0.1:8101;
}

upstream flask_app {
    server 127.0.0.1:8102;
}

server {
    listen 80;
    server_name mcp2.patchevergreen.com mcp.patchevergreen.com;

    # Custom 404 page for this vhost only (file mounted at /var/www/patchevergreen-mcp/404.html)
    error_page 404 /pegmcp-404.html;

    # MCP SSE endpoint - route to FastMCP server
    # FastMCP SSE serves at root path, so we proxy /sse to the MCP server root
    location /sse {
        # CORS headers for MCP clients (like Cursor) - added after proxy_pass to avoid interfering with SSE stream
        add_header 'Access-Control-Allow-Origin' '*' always;
        add_header 'Access-Control-Allow-Methods' 'GET, POST, OPTIONS' always;
        add_header 'Access-Control-Allow-Headers' 'Content-Type, Authorization' always;

        # Handle CORS preflight requests
        if ($request_method = 'OPTIONS') {
            add_header 'Access-Control-Allow-Origin' '*' always;
            add_header 'Access-Control-Allow-Methods' 'GET, POST, OPTIONS' always;
            add_header 'Access-Control-Allow-Headers' 'Content-Type, Authorization' always;
            add_header 'Access-Control-Max-Age' 86400 always;
            return 204;
        }

        proxy_pass http://mcp_sse;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # SSE specific settings
        proxy_buffering off;
        proxy_cache off;
        chunked_transfer_encoding off;

        # Timeouts for long-lived connections
        proxy_read_timeout 86400;
        proxy_send_timeout 86400;
    }

    # MCP Messages endpoint - route to FastMCP server
    location /messages {
        # CORS headers
        add_header 'Access-Control-Allow-Origin' '*' always;
        add_header 'Access-Control-Allow-Methods' 'GET, POST, OPTIONS' always;
        add_header 'Access-Control-Allow-Headers' 'Content-Type, Authorization' always;

        # Handle CORS preflight
        if ($request_method = 'OPTIONS') {
            add_header 'Access-Control-Allow-Origin' '*' always;
            add_header 'Access-Control-Allow-Methods' 'GET, POST, OPTIONS' always;
            add_header 'Access-Control-Allow-Headers' 'Content-Type, Authorization' always;
            add_header 'Access-Control-Max-Age' 86400 always;
            return 204;
        }

        proxy_pass http://mcp_sse;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Standard proxy settings
        proxy_buffering off;
    }

    location = /pegmcp-404.html {
        alias /var/www/patchevergreen-mcp/404.html;
        internal;
    }

    # All other routes go to Flask (Skill endpoints); unknown paths show custom 404.html
    location / {
        proxy_pass http://flask_app;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Standard proxy settings
        proxy_redirect off;

        # Intercept 404 responses and show custom page
        proxy_intercept_errors on;
    }
}
