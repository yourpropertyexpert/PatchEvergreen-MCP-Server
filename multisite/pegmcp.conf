# Deploy with a Docker nginx proxy (network_mode: host, sites-enabled -> conf.d):
#
# 1. Copy this file into your nginx sites-enabled/ directory (mounted as /etc/nginx/conf.d).
# 2. Mount nginx/404.html from this repo into the nginx container, e.g. in your nginx
#    docker-compose.yml:
#      - ../PatchEvergreen-MCP-Server/nginx/404.html:/usr/share/nginx/html/patchevergreen-mcp/404.html:ro
# 3. Start backends: cd multisite && docker compose up -d
# 4. Reload nginx: docker compose exec nginx nginx -s reload  (or restart the container)
#
# HTTPS is terminated at Cloudflare; this vhost listens on HTTP only.
# Upstreams use 127.0.0.1 because the nginx container runs with network_mode: host and
# the MCP/Flask containers publish 8101/8102 on the host loopback interface.

upstream mcp_sse {
    server 127.0.0.1:8101;
}

upstream flask_app {
    server 127.0.0.1:8102;
}

server {
    listen 80;
    server_name mcp2.patchevergreen.com;

    # Custom 404 page - intercept 404s from backend and show custom page
    error_page 404 /404.html;

    # MCP SSE endpoint - route to FastMCP server
    # FastMCP SSE serves at root path, so we proxy /sse to the MCP server root
    location /sse {
        # CORS headers for MCP clients (like Cursor) - added after proxy_pass to avoid interfering with SSE stream
        add_header 'Access-Control-Allow-Origin' '*' always;
        add_header 'Access-Control-Allow-Methods' 'GET, POST, OPTIONS' always;
        add_header 'Access-Control-Allow-Headers' 'Content-Type, Authorization' always;

        # Handle CORS preflight requests
        if ($request_method = 'OPTIONS') {
            add_header 'Access-Control-Allow-Origin' '*' always;
            add_header 'Access-Control-Allow-Methods' 'GET, POST, OPTIONS' always;
            add_header 'Access-Control-Allow-Headers' 'Content-Type, Authorization' always;
            add_header 'Access-Control-Max-Age' 86400 always;
            return 204;
        }

        proxy_pass http://mcp_sse;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # SSE specific settings
        proxy_buffering off;
        proxy_cache off;
        chunked_transfer_encoding off;

        # Timeouts for long-lived connections
        proxy_read_timeout 86400;
        proxy_send_timeout 86400;
    }

    # MCP Messages endpoint - route to FastMCP server
    location /messages {
        # CORS headers
        add_header 'Access-Control-Allow-Origin' '*' always;
        add_header 'Access-Control-Allow-Methods' 'GET, POST, OPTIONS' always;
        add_header 'Access-Control-Allow-Headers' 'Content-Type, Authorization' always;

        # Handle CORS preflight
        if ($request_method = 'OPTIONS') {
            add_header 'Access-Control-Allow-Origin' '*' always;
            add_header 'Access-Control-Allow-Methods' 'GET, POST, OPTIONS' always;
            add_header 'Access-Control-Allow-Headers' 'Content-Type, Authorization' always;
            add_header 'Access-Control-Max-Age' 86400 always;
            return 204;
        }

        proxy_pass http://mcp_sse;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Standard proxy settings
        proxy_buffering off;
    }

    # All other routes go to Flask (Skill endpoints)
    location / {
        proxy_pass http://flask_app;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Standard proxy settings
        proxy_redirect off;

        # Intercept 404 responses and show custom page
        proxy_intercept_errors on;
    }

    # Handle 404 errors from backend services
    location = /404.html {
        root /usr/share/nginx/html/patchevergreen-mcp;
        internal;
    }
}
